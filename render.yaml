# ─────────────────────────────────────────────────────
#  render.yaml — Render.com Infrastructure-as-Code
#  Deploy the dashboard on Render's free tier
#
#  Usage:
#    1. Push this repo to GitHub
#    2. Go to https://dashboard.render.com
#    3. Click "New" → "Blueprint" → connect your repo
#    4. Render auto-detects this file and deploys
#
#  Cost: ₹0 (free tier — no credit card needed)
# ─────────────────────────────────────────────────────

services:
  - type: web
    name: myntra-discovery-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_dashboard.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: DB_PATH
        value: data/myntra_discovery.db
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_RPM_LIMIT
        value: "15"
      - key: LLM_DAILY_TOKEN_LIMIT
        value: "1000000"
      - key: PYTHON_VERSION
        value: "3.10.7"
    healthCheckPath: /api/overview
    autoDeploy: true
